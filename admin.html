<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Nexora Control</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B1426;--card:#111D36;--card2:#13203A;--line:#1F2D4A;--tx:#E8EDF7;--mut:#8A9BB8;--mut2:#9AA9C4;--gold:#E6B450;
--up:#3FD39A;--dn:#FF6B7A;--upb:#0E8A5F;--dnb:#C8303F}
*{box-sizing:border-box}html,body{margin:0;background:#070E1C;color:var(--tx);font-family:Inter,system-ui,sans-serif}
button{font-family:inherit;cursor:pointer}a{color:var(--gold)}
.wrap{max-width:900px;margin:0 auto;padding:14px 14px 40px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0 12px}
.bn{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:19px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tab{flex-shrink:0;height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--line);background:var(--card2);
color:var(--mut2);font-size:13px;font-weight:600}
.tab.on{background:var(--gold);color:var(--bg);border-color:var(--gold)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.st{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.st b{display:block;font-size:24px;font-family:'Space Grotesk'}.st span{font-size:12px;color:var(--mut2)}
.in{height:42px;width:100%;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--card2);
color:var(--tx);font-size:14px;font-family:inherit}
textarea.in{height:auto;padding:10px}
.fl{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mut)}
.btn{height:40px;padding:0 14px;border:0;border-radius:10px;font-weight:600;font-size:13.5px}
.gold{background:var(--gold);color:var(--bg)}.dark{background:#1E2E52;color:var(--tx)}
.ok{background:var(--upb);color:#fff}.bad{background:var(--dnb);color:#fff}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.k{font-size:12px;color:var(--mut2)}.v{font-size:13.5px;word-break:break-all}
.pill{font-size:11px;padding:3px 8px;border-radius:8px;background:#2A2410;color:var(--gold);font-weight:600}
.pill.g1{background:rgba(14,138,95,.2);color:var(--up)}.pill.r1{background:rgba(200,48,63,.2);color:var(--dn)}
.kv{display:grid;grid-template-columns:110px 1fr;gap:4px 10px;margin:8px 0}
.msg{font-size:13px;padding:10px 12px;border-radius:10px;margin:8px 0;display:none}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#1E2E52;border:1px solid var(--gold);
padding:12px 16px;border-radius:12px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;z-index:9}
.toast.on{opacity:1}
.sub{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
</style>
</head>
<body>
<div class="wrap">
<div class="top">
<div style="display:flex;align-items:center;gap:8px"><svg width="30" height="30" viewBox="0 0 64 64" aria-hidden="true">
<path d="M32 3l25 14.5v29L32 61 7 46.5v-29z" fill="none" stroke="#E6B450" stroke-width="5" stroke-linejoin="round"/>
<path d="M22 42V22l20 20V22" fill="none" stroke="#E8EDF7" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>
<div><div class="bn">Nexora Control</div><div class="k" id="who"></div></div></div>
<button class="btn dark" id="outBtn" style="display:none" onclick="logout()">Log out</button>
</div>

<!-- LOGIN -->
<div id="login" class="card" style="max-width:420px;margin:30px auto">
<div class="bn" style="font-size:18px;margin-bottom:10px">Admin login</div>
<form id="lf" style="display:flex;flex-direction:column;gap:10px">
<label class="fl" id="lE">Email<input class="in" name="e" type="email" autocomplete="username"></label>
<label class="fl" id="lP">Password<input class="in" name="p" type="password" autocomplete="current-password"></label>
<label class="fl" id="lC" style="display:none">Google Authenticator code<input class="in" name="c" inputmode="numeric"
maxlength="6"></label>
<div class="msg" id="lm"></div>
<button class="btn gold" type="submit" id="lb">Log in</button>
</form>
</div>

<!-- PANEL -->
<div id="panel" style="display:none">
<div class="tabs" id="tabs">
<button class="tab on" data-t="dash">Dashboard</button><button class="tab" data-t="dep">Deposits</button>
<button class="tab" data-t="wd">Withdrawals</button><button class="tab" data-t="spot">Trading</button><button class="tab" data-t="p2p">P2P</button><button class="tab" data-t="users">Users</button><button class="tab" data-t="kyc">KYC</button>
<button class="tab" data-t="coins">Coins &amp; QR</button><button class="tab" data-t="move">Fund transfer</button>
<button class="tab" data-t="list">Listings</button><button class="tab" data-t="ctry">Countries</button><button class="tab" data-t="audit">Audit log</button>
</div>
<div id="view"></div>
</div>
</div>
<div class="toast" id="toast"></div>

<script>
var sb=supabase.createClient('https://cttfcljydiluvccgivto.supabase.co','sb_publishable_JEp-0dxsA6_PZF6Hcb5fSQ_LWAevHDL');
var ROLE=null,TAB='dash',FAC=null,DSUB='open',WSUB='open';
function $(i){return document.getElementById(i);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return '&#'+c.charCodeAt(0)+';';});}
function say(t){var x=$('toast');x.textContent=t;x.classList.add('on');clearTimeout(x._h);x._h=setTimeout(function(){
x.classList.remove('on');},3500);}
function lmsg(t,ok){var m=$('lm');m.style.display=t?'block':'none';m.textContent=t||'';
m.style.background=ok?'rgba(14,138,95,.18)':'rgba(200,48,63,.18)';m.style.color=ok?'#7FE3BA':'#FF9AA5';}
function dt(x){return x?new Date(x).toLocaleString():'';}
function num(v){return (+v||0).toLocaleString('en-US',{maximumFractionDigits:8});}
var EXP={TRC20:'https://tronscan.org/#/transaction/',BEP20:'https://bscscan.com/tx/',ERC20:'https://etherscan.io/tx/',
BTC:'https://blockstream.info/tx/',SOL:'https://solscan.io/tx/',POLYGON:'https://polygonscan.com/tx/'};
var AEXP={TRC20:'https://tronscan.org/#/address/',BEP20:'https://bscscan.com/address/',ERC20:'https://etherscan.io/address/',
BTC:'https://blockstream.info/address/',SOL:'https://solscan.io/account/',POLYGON:'https://polygonscan.com/address/'};
function rpc(n,a){return sb.rpc(n,a||{}).then(function(r){if(r.error){say(r.error.message);throw r.error;}return r.data;});}
function pill(s){var c={approved:'g1',active:'g1',rejected:'r1',frozen:'r1',locked:'r1'}[s]||'';
return '<span class="pill '+c+'">'+esc(s)+'</span>';}

/* ---- login: password, then 2FA ---- */
$('lf').onsubmit=function(e){e.preventDefault();var f=new FormData(this);lmsg('');
if(FAC){sb.auth.mfa.challengeAndVerify({factorId:FAC,code:(f.get('c')||'').trim()}).then(function(r){
if(r.error){lmsg('Wrong code');return;}enter();});return;}
sb.auth.signInWithPassword({email:f.get('e'),password:f.get('p')}).then(function(r){if(r.error){lmsg(r.error.message);return;}
afterPass();});};
function afterPass(){sb.auth.mfa.listFactors().then(function(l){var t=((l.data||{}).totp||[]).filter(function(x){
return x.status==='verified';})[0];if(!t){lmsg('Turn on Google Authenticator (2FA) on the main website first, then log in here.');
return;}sb.auth.mfa.getAuthenticatorAssuranceLevel().then(function(a){if((a.data||{}).currentLevel==='aal2'){enter();return;}
FAC=t.id;$('lE').style.display='none';$('lP').style.display='none';$('lC').style.display='flex';$('lb').textContent='Verify';});});}
function enter(){rpc('nx_admin_me').then(function(m){if(!m||!m.role){lmsg('This account is not an admin.');sb.auth.signOut();
return;}if(m.aal!=='aal2'){afterPass();return;}ROLE=m.role;$('login').style.display='none';$('panel').style.display='block';
$('outBtn').style.display='';sb.auth.getUser().then(function(u){$('who').textContent=(u.data.user||{}).email+' · '+ROLE;});
show();});}
function logout(){sb.auth.signOut().then(function(){location.reload();});}
sb.auth.getSession().then(function(s){if(s.data.session)afterPass();});

$('tabs').onclick=function(e){var b=e.target.closest('.tab');if(!b)return;TAB=b.dataset.t;
this.querySelectorAll('.tab').forEach(function(x){x.classList.toggle('on',x===b);});show();};
function show(){$('view').innerHTML='<div class="k">Loading…</div>';({dash:vDash,dep:vDep,wd:vWd,users:vUsers,coins:vCoins,
move:vMove,list:vList,audit:vAudit,kyc:vKyc,ctry:vCtry,spot:vSpot,p2p:vP2p})[TAB]();}

/* ---- dashboard ---- */
function vDash(){rpc('nx_admin_stats').then(function(s){$('view').innerHTML='<div class="g">'+
[['Users',s.users],['New today',s.users_today],['Pending deposits',s.dep_pending],['Pending withdrawals',s.wd_pending],
['New listing requests',s.listings],['Frozen accounts',s.frozen]].map(function(x){return '<div class="st"><b>'+x[1]+
'</b><span>'+x[0]+'</span></div>';}).join('')+'</div><div class="card" style="margin-top:10px"><div class="bn" '+
'style="font-size:15px">User funds held</div>'+((s.balances||[]).map(function(b){return '<div class="row" style="justify-content:'+
'space-between;padding:6px 0;border-bottom:1px solid var(--line)"><b>'+esc(b.asset)+'</b><span>'+num(b.balance)+
(+b.locked?' <span class="k">(+'+num(b.locked)+' in withdrawal)</span>':'')+'</span></div>';}).join('')||
'<div class="k">No balances yet</div>')+'</div>';});}

/* ---- deposits ---- */
function sub(cur,fn){return '<div class="sub">'+[['open','Open'],['approved','Approved'],['rejected','Rejected'],['all','All']]
.map(function(x){return '<button class="tab'+(x[0]===cur?' on':'')+'" onclick="'+fn+'(\''+x[0]+'\')">'+x[1]+'</button>';})
.join('')+'</div>';}
function setD(s){DSUB=s;vDep();}function setW(s){WSUB=s;vWd();}
function vDep(){rpc('nx_admin_deposits',{p_status:DSUB}).then(function(l){$('view').innerHTML=sub(DSUB,'setD')+(l.map(function(d){
var open=d.status==='processing'||d.status==='hold';return '<div class="card"><div class="row" style="justify-content:space-between">'+
'<b>#'+d.id+' · '+num(d.amount)+' '+esc(d.asset)+' <span class="k">'+esc(d.network)+'</span></b>'+pill(d.status)+'</div>'+
'<div class="kv"><span class="k">User</span><span class="v">'+esc(d.uid)+' · '+esc(d.full_name||'')+' · '+esc(d.email)+'</span>'+
'<span class="k">From</span><span class="v">'+(d.source==='self'?'Self (own wallet)':'Someone else: '+esc(d.source_name))+'</span>'+
'<span class="k">TxID</span><span class="v"><a target="_blank" rel="noopener" href="'+esc((EXP[d.network]||'')+d.txid)+'">'+
esc(d.txid)+'</a></span><span class="k">Time</span><span class="v">'+dt(d.created_at)+'</span>'+
(d.admin_note?'<span class="k">Note</span><span class="v">'+esc(d.admin_note)+'</span>':'')+
(d.auto_note?'<span class="k">Auto check</span><span class="v" style="color:var(--gold)">'+esc(d.auto_note)+'</span>':'')+
(d.onchain_amount!=null?'<span class="k">On blockchain</span><span class="v">'+num(d.onchain_amount)+' '+esc(d.asset)+' · '+
(d.confirmations||0)+' conf.</span>':'')+'</div>'+
(d.docs_status?'<div class="card" style="background:var(--card2);margin:4px 0 8px"><div class="row" style="justify-content:'+
'space-between"><b style="font-size:13px">Documents</b>'+pill(d.docs_status)+'</div>'+((d.docs||[]).map(function(p,k){
return '<button class="btn dark" style="height:32px;margin:6px 6px 0 0" onclick="viewDoc(\''+esc(p)+'\')">File '+(k+1)+'</button>';})
.join('')||'<div class="k" style="margin-top:6px">Waiting for the user to upload</div>')+'</div>':'')+
(open?'<div class="row" style="margin-bottom:8px"><button class="btn dark" onclick="reD('+d.id+')">Check blockchain now</button>'+
'<button class="btn dark" onclick="docD('+d.id+')">Ask for documents</button></div>':'')+
(open?'<div class="k" style="margin-bottom:6px">Open the TxID link, check: sent to our address, same coin &amp; network, '+
'amount, enough confirmations.</div><div class="row"><input class="in" style="flex:1;min-width:120px" id="da'+d.id+
'" placeholder="Credit amount ('+num(d.amount)+')"><input class="in" style="flex:2;min-width:160px" id="dn'+d.id+
'" placeholder="Note / reason"></div><div class="row" style="margin-top:8px"><button class="btn ok" onclick="decD('+d.id+
',\'approve\')">Approve &amp; credit</button><button class="btn dark" onclick="decD('+d.id+',\'hold\')">Hold</button>'+
'<button class="btn bad" onclick="decD('+d.id+',\'reject\')">Reject</button></div>':'')+'</div>';}).join('')||
'<div class="k">Nothing here.</div>');});}
function viewDoc(p){sb.storage.from('kyc').createSignedUrl(p,600).then(function(r){if(r.error){say(r.error.message);return;}
window.open(r.data.signedUrl,'_blank');});}
function docD(id){var n=$('dn'+id).value.trim();if(!confirm('Ask the user for documents? (Write a custom list in Note, or leave '+
'it empty for the standard list)'))return;rpc('nx_admin_deposit_docs',{p_id:id,p_note:n||null}).then(function(){say('Asked');vDep();});}
function reD(id){say('Checking…');rpc('nx_admin_deposit_recheck',{p_id:id}).then(function(r){say('Result: '+r);vDep();});}
function decD(id,a){var amt=$('da'+id).value.trim(),n=$('dn'+id).value.trim();
if(a==='approve'&&!confirm('Approve and credit this deposit?'))return;
rpc('nx_admin_deposit_decide',{p_id:id,p_action:a,p_note:n||null,p_amount:amt?+amt:null}).then(function(){say('Done');vDep();});}

/* ---- withdrawals ---- */
function vWd(){rpc('nx_admin_withdrawals',{p_status:WSUB}).then(function(l){$('view').innerHTML=sub(WSUB,'setW')+(l.map(function(w){
var open=w.status==='pending'||w.status==='hold';return '<div class="card"><div class="row" style="justify-content:space-between">'+
'<b>#'+w.id+' · '+num(w.amount)+' '+esc(w.asset)+' <span class="k">'+esc(w.network)+'</span></b>'+pill(w.status)+'</div>'+
'<div class="kv"><span class="k">User</span><span class="v">'+esc(w.uid)+' · '+esc(w.full_name||'')+' · '+esc(w.email)+'</span>'+
'<span class="k">Send to</span><span class="v"><a target="_blank" rel="noopener" href="'+esc((AEXP[w.network]||'')+w.address)+
'">'+esc(w.address)+'</a></span><span class="k">Send amount</span><span class="v" style="color:var(--gold);font-weight:700">'+
num(w.receive)+' '+esc(w.asset)+' <span class="k">(fee '+num(w.fee)+')</span></span><span class="k">Time</span><span class="v">'+
dt(w.created_at)+'</span>'+(w.txid_out?'<span class="k">Paid TxID</span><span class="v"><a target="_blank" rel="noopener" href="'+
esc((EXP[w.network]||'')+w.txid_out)+'">'+esc(w.txid_out)+'</a></span>':'')+(w.admin_note?'<span class="k">Note</span><span '+
'class="v">'+esc(w.admin_note)+'</span>':'')+'</div>'+(open?'<div class="k" style="margin-bottom:6px">1) Check the user. 2) Send '+
'<b>'+num(w.receive)+' '+esc(w.asset)+'</b> on <b>'+esc(w.network)+'</b> from the exchange wallet. 3) Paste the TxID and approve.'+
'</div><input class="in" id="wt'+w.id+'" placeholder="TxID of the payment you sent"><input class="in" style="margin-top:8px" '+
'id="wn'+w.id+'" placeholder="Note / reason"><div class="row" style="margin-top:8px"><button class="btn ok" onclick="decW('+w.id+
',\'approve\')">Approve (paid)</button><button class="btn dark" onclick="decW('+w.id+',\'hold\')">Hold</button><button '+
'class="btn bad" onclick="decW('+w.id+',\'reject\')">Reject &amp; refund</button></div>':'')+'</div>';}).join('')||
'<div class="k">Nothing here.</div>');});}
function decW(id,a){var t=$('wt'+id).value.trim(),n=$('wn'+id).value.trim();
if(a!=='hold'&&!confirm(a==='approve'?'Mark as paid?':'Reject and return the funds to the user?'))return;
rpc('nx_admin_withdraw_decide',{p_id:id,p_action:a,p_txid:t||null,p_note:n||null}).then(function(){say('Done');vWd();});}

/* ---- users ---- */
var UQ='';
function vUsers(){rpc('nx_admin_users',{p_q:UQ}).then(function(l){$('view').innerHTML='<div class="row" style="margin-bottom:10px">'+
'<input class="in" style="flex:1" id="uq" placeholder="Search UID, email or name" value="'+esc(UQ)+'"><button class="btn gold" '+
'onclick="UQ=$(\'uq\').value.trim();vUsers()">Search</button></div>'+(l.map(function(u){return '<div class="card"><div class="row" '+
'style="justify-content:space-between"><b>'+esc(u.uid)+' · '+esc(u.full_name||'—')+'</b>'+pill(u.status)+'</div><div class="kv">'+
'<span class="k">Email</span><span class="v">'+esc(u.email)+(u.verified?' <span class="pill g1">verified</span>':
' <span class="pill">not verified</span>')+'</span><span class="k">2FA</span><span class="v">'+(u.twofa?'On':'Off')+'</span>'+
'<span class="k">Country</span><span class="v">'+esc(u.country||'—')+'</span><span class="k">Mobile</span>'+
'<span class="v">'+esc(u.mobile||'—')+'</span><span class="k">KYC</span><span class="v">'+pill(u.kyc_status||'none')+'</span>'+
'<span class="k">Joined</span><span class="v">'+dt(u.created_at)+'</span><span class="k">Referred by</span><span class="v">'+
esc(u.referred_by||'—')+'</span><span class="k">Balances</span><span class="v">'+((u.wallets||[]).map(function(w){
return esc(w.account)+': '+num(w.balance)+' '+esc(w.asset)+(+w.locked?' (+'+num(w.locked)+' locked)':'');}).join('<br>')||'0')+
'</span><span class="k">Withdrawals</span><span class="v">'+(u.withdraw_blocked?'<span class="pill r1">blocked</span>':'allowed')+
'</span></div><div class="row"><select class="in" style="width:auto" id="us'+u.id+'"><option value="active"'+
(u.status==='active'?' selected':'')+'>Active</option><option value="frozen"'+(u.status==='frozen'?' selected':'')+
'>Frozen (hold funds)</option><option value="locked"'+(u.status==='locked'?' selected':'')+'>Locked</option></select><label '+
'class="k" style="display:flex;align-items:center;gap:6px"><input type="checkbox" id="ub'+u.id+'"'+(u.withdraw_blocked?' checked':'')+
'> Block withdrawals</label></div><div class="row" style="margin-top:8px"><input class="in" style="flex:1" id="un'+u.id+
'" placeholder="Reason (required)"><button class="btn dark" onclick="setU(\''+u.id+'\')">Save</button></div></div>';}).join('')||
'<div class="k">No users found.</div>');});}
function setU(id){rpc('nx_admin_user_set',{p_user:id,p_status:$('us'+id).value,p_withdraw_blocked:$('ub'+id).checked,
p_note:$('un'+id).value.trim()}).then(function(){say('Saved');vUsers();});}

/* ---- coins & QR ---- */
var FIELDS=[['asset','Coin symbol'],['network','Network (TRC20/BEP20/ERC20/BTC/SOL/POLYGON)'],['coin_name','Coin name'],
['deposit_address','Deposit address'],['contract','Token contract (if token)'],['withdraw_fee','Withdrawal fee'],
['min_withdraw','Min withdrawal'],['min_deposit','Min deposit'],['conf_credit','Confirmations to credit'],
['conf_unlock','Confirmations to unlock'],['other_auto_max','Auto-credit limit for deposits from someone else\'s wallet (above this: documents needed)'],['decimals','Decimals'],['sort','Order']];
function vCoins(){rpc('nx_admin_networks').then(function(l){window._nets=l;$('view').innerHTML='<button class="btn gold" '+
'style="margin-bottom:10px" onclick="editN(-1)">+ Add coin / network</button>'+l.map(function(n,i){return '<div class="card">'+
'<div class="row" style="justify-content:space-between"><b>'+esc(n.asset)+' · '+esc(n.network)+'</b>'+(n.enabled?
'<span class="pill g1">on</span>':'<span class="pill r1">off</span>')+'</div><div class="row" style="margin-top:8px;gap:12px">'+
(n.qr_url?'<img src="'+esc(n.qr_url)+'" alt="" style="width:70px;height:70px;background:#fff;border-radius:8px">':
'<span class="k">No QR uploaded (auto QR)</span>')+'<span class="v" style="flex:1">'+esc(n.deposit_address||'No address')+'</span>'+
'</div><div class="k" style="margin-top:6px">Fee '+num(n.withdraw_fee)+' · min withdraw '+num(n.min_withdraw)+' · min deposit '+
num(n.min_deposit)+'</div><button class="btn dark" style="margin-top:8px" onclick="editN('+i+')">Edit</button></div>';}).join('');});}
function editN(i){var n=i>=0?window._nets[i]:{enabled:true,conf_credit:1,conf_unlock:1,decimals:6,sort:100};
$('view').innerHTML='<div class="card"><div class="bn" style="font-size:16px;margin-bottom:8px">'+(i>=0?'Edit '+esc(n.asset)+
' · '+esc(n.network):'Add coin / network')+'</div><div style="display:flex;flex-direction:column;gap:8px">'+FIELDS.map(function(f){
return '<label class="fl">'+f[1]+'<input class="in" id="f_'+f[0]+'" value="'+esc(n[f[0]]==null?'':n[f[0]])+'"'+
(i>=0&&(f[0]==='asset'||f[0]==='network')?' readonly':'')+'></label>';}).join('')+'<label class="fl">QR image (optional)'+
'<input class="in" type="file" accept="image/*" id="f_qrfile" style="padding-top:8px"></label><input type="hidden" id="f_qr_url" '+
'value="'+esc(n.qr_url||'')+'"><div id="qrprev">'+(n.qr_url?'<img src="'+esc(n.qr_url)+'" style="width:120px;background:#fff;'+
'border-radius:8px">':'')+'</div><label class="k" style="display:flex;gap:6px;align-items:center"><input type="checkbox" '+
'id="f_enabled"'+(n.enabled?' checked':'')+'> Enabled (users can see it)</label><div class="row"><button class="btn gold" '+
'onclick="saveN()">Save</button><button class="btn dark" onclick="vCoins()">Cancel</button>'+(n.qr_url?'<button class="btn dark" '+
'onclick="$(\'f_qr_url\').value=\'\';$(\'qrprev\').innerHTML=\'<span class=k>QR removed (auto QR)</span>\'">Remove QR</button>':'')+
'</div></div></div>';
$('f_qrfile').onchange=function(){var file=this.files[0];if(!file)return;if(file.size>2e6){say('Image must be under 2 MB');return;}
var a=$('f_asset').value.trim().toUpperCase(),nw=$('f_network').value.trim().toUpperCase();if(!a||!nw){say('Fill coin and network first');
return;}var path=a+'_'+nw+'_'+Date.now()+'.'+(file.name.split('.').pop()||'png');say('Uploading…');
sb.storage.from('qr').upload(path,file,{upsert:true,contentType:file.type}).then(function(r){if(r.error){say(r.error.message);return;}
var u=sb.storage.from('qr').getPublicUrl(path).data.publicUrl;$('f_qr_url').value=u;$('qrprev').innerHTML='<img src="'+esc(u)+
'" style="width:120px;background:#fff;border-radius:8px">';say('QR uploaded. Press Save.');});};}
function saveN(){var p={};FIELDS.forEach(function(f){var v=$('f_'+f[0]).value.trim();if(v!=='')p[f[0]]=v;});p.qr_url=$('f_qr_url').value;
p.enabled=$('f_enabled').checked;rpc('nx_admin_network_save',{p:p}).then(function(){say('Saved');vCoins();});}

/* ---- owner fund transfer ---- */
function vMove(){$('view').innerHTML='<div class="card"><div class="bn" style="font-size:16px">Fund transfer between accounts</div>'+
'<div class="k" style="margin:6px 0 10px;line-height:1.5">Owner only. Use only after checking KYC and documents (for example a '+
'locked account moving funds to a verified family account). Every transfer is saved in the audit log.</div><div style="display:flex;'+
'flex-direction:column;gap:8px"><label class="fl">From UID<input class="in" id="m_f" placeholder="NX…"></label><label class="fl">To UID'+
'<input class="in" id="m_t" placeholder="NX…"></label><label class="fl">Coin<input class="in" id="m_a" value="USDT"></label><label '+
'class="fl">Amount<input class="in" id="m_n" inputmode="decimal"></label><label class="fl">Reason and documents checked<textarea '+
'class="in" id="m_r" rows="3"></textarea></label><button class="btn gold" onclick="doMove()">Transfer</button></div></div>';}
function doMove(){var f=$('m_f').value,t=$('m_t').value,a=$('m_a').value.trim().toUpperCase(),n=+$('m_n').value;
if(!confirm('Move '+n+' '+a+' from '+f+' to '+t+'?'))return;rpc('nx_admin_move_funds',{p_from_uid:f,p_to_uid:t,p_asset:a,p_amount:n,
p_reason:$('m_r').value}).then(function(){say('Transferred');vMove();});}

/* ---- listings ---- */
var LN={supply:'Total supply',launch:'Launch date',logo:'Logo',pool:'Liquidity pool',audit:'Audit report',whitepaper:'Whitepaper',
twitter:'X (Twitter)',other:'Other links',team:'Team',company:'Company',ccountry:'Company country',caddress:'Company address',
cname:'Contact person',crole:'Role',cphone:'Phone / Telegram'};
function lnk(v){v=String(v||'');return /^https?:\/\//i.test(v)?'<a target="_blank" rel="noopener" href="'+esc(v)+'">'+esc(v)+'</a>':esc(v);}
function vList(){rpc('nx_admin_listings').then(function(l){$('view').innerHTML=l.map(function(x){var d=x.details||{};
return '<div class="card"><div class="row" style="justify-content:space-between"><b>'+esc(x.project)+' ('+esc(x.symbol)+')</b>'+
pill(x.status)+'</div><div class="kv"><span class="k">Chain</span><span class="v">'+esc(x.chain)+'</span><span class="k">Contract</span>'+
'<span class="v">'+esc(x.contract)+'</span><span class="k">Website</span><span class="v">'+lnk(x.website)+'</span><span class="k">'+
'Telegram</span><span class="v">'+lnk(x.community)+'</span><span class="k">Email</span><span class="v">'+esc(x.email)+'</span>'+
Object.keys(LN).filter(function(k){return d[k];}).map(function(k){return '<span class="k">'+LN[k]+'</span><span class="v" '+
'style="white-space:pre-line">'+lnk(d[k])+'</span>';}).join('')+'<span class="k">About</span><span class="v" style="white-space:'+
'pre-line">'+esc(x.about||'')+'</span><span class="k">Date</span><span class="v">'+dt(x.created_at)+'</span>'+(x.admin_note?
'<span class="k">Note</span><span class="v">'+esc(x.admin_note)+'</span>':'')+'</div><div class="k" style="margin-bottom:6px">'+
'Check: contract on the explorer, liquidity is real and locked, website and Telegram are active, team is real, audit.</div>'+
'<input class="in" id="ln'+x.id+'" placeholder="Note (optional)"><div class="row" style="margin-top:8px">'+
['reviewing','approved','rejected'].map(function(s){return '<button class="btn '+(s==='approved'?'ok':s==='rejected'?'bad':'dark')+
'" onclick="setL('+x.id+',\''+s+'\')">'+s+'</button>';}).join('')+'</div></div>';}).join('')||
'<div class="k">No applications yet.</div>';});}
function setL(id,s){rpc('nx_admin_listing_set',{p_id:id,p_status:s,p_note:$('ln'+id).value.trim()||null}).then(function(){
say('Saved');vList();});}

/* ---- trading ---- */
function vSpot(){rpc('nx_admin_spot').then(function(s){var st=s.settings||{};$('view').innerHTML='<div class="g">'+
[['Trades (24h)',s.trades_today],['Volume (24h)',num(Math.round(s.volume_today))+' USDT'],['Open limit orders',s.open_orders]]
.map(function(x){return '<div class="st"><b>'+x[1]+'</b><span>'+x[0]+'</span></div>';}).join('')+'</div>'+
'<div class="card" style="margin-top:10px"><div class="bn" style="font-size:15px">Fee income</div>'+((s.fees||[]).map(function(f){
return '<div class="row" style="justify-content:space-between;padding:5px 0"><b>'+esc(f.asset)+'</b><span>'+num(f.amount)+'</span></div>';})
.join('')||'<div class="k">No fees yet</div>')+'</div><div class="card"><div class="bn" style="font-size:15px">Busy coins (24h)</div>'+((s.markets||[]).map(function(m){
return '<div class="row" style="justify-content:space-between;padding:5px 0"><b>'+esc(m.symbol)+'/USDT</b><span>'+m.trades+
' trades · '+num(Math.round(m.vol))+' USDT</span></div>';}).join('')||'<div class="k">No trades yet</div>')+'</div>'+
'<div class="card"><div class="bn" style="font-size:15px;margin-bottom:8px">Settings</div>'+'<div style="display:flex;flex-direction:column;gap:8px"><label class="fl">Trading fee (%)<input class="in" id="sf" value="'+
(+st.taker_fee*100)+'"></label><label class="fl">Minimum order (USDT)<input class="in" id="sm" value="'+num(st.min_order)+'"></label>'+
'<label class="k" style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="se"'+(st.enabled?' checked':'')+
'> Trading is ON</label><button class="btn gold" onclick="saveSpot()">Save</button></div></div><div class="card"><div class="bn" '+
'style="font-size:15px;margin-bottom:6px">Recent trades</div>'+((s.recent||[]).map(function(t){return '<div class="row" '+
'style="justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px"><span>'+num(t.qty)+' '+
esc(t.symbol)+' @ '+num(t.price)+' <span class="k">buyer '+esc(t.buyer_uid||'')+' · seller '+esc(t.seller_uid||'')+'</span></span>'+
'<span class="k">'+dt(t.created_at)+'</span></div>';}).join('')||'<div class="k">No trades yet</div>')+'</div>';});}
function saveSpot(){rpc('nx_admin_spot_settings',{p_fee:(+$('sf').value||0)/100,p_min:+$('sm').value||0,p_enabled:$('se').checked})
.then(function(){say('Saved');vSpot();});}

/* ---- P2P ---- */
var PSUB='appeal';function setP(x){PSUB=x;vP2p();}
function vP2p(){rpc('nx_admin_p2p',{p_status:PSUB}).then(function(d){var st=d.settings||{},c=d.counts||{};
$('view').innerHTML='<div class="sub">'+[['appeal','Appeals ('+(c.appeal||0)+')'],['open','Open'],['completed','Completed'],
['cancelled','Cancelled'],['all','All']].map(function(x){return '<button class="tab'+(x[0]===PSUB?' on':'')+'" onclick="setP(\''+x[0]+
'\')">'+x[1]+'</button>';}).join('')+'</div>'+((d.orders||[]).map(function(o){var open=['pending','paid','appeal'].indexOf(o.status)>-1;
return '<div class="card"><div class="row" style="justify-content:space-between"><b>#'+o.id+' · '+num(o.qty)+' USDT · '+num(o.fiat_amount)+
' '+esc(o.fiat)+'</b>'+pill(o.status)+'</div><div class="kv"><span class="k">Buyer</span><span class="v">'+esc(o.buyer_uid)+' · '+
esc(o.buyer_name||'')+'</span><span class="k">Seller</span><span class="v">'+esc(o.seller_uid)+' · '+esc(o.seller_name||'')+'</span>'+
'<span class="k">Price</span><span class="v">'+num(o.price)+' '+esc(o.fiat)+'</span><span class="k">Pay to</span><span class="v">'+
(o.pay_methods||[]).map(function(m){return esc(m.type)+': '+esc(m.name)+' · '+esc(m.details);}).join('<br>')+'</span>'+
'<span class="k">Created</span><span class="v">'+dt(o.created_at)+'</span>'+(o.paid_at?'<span class="k">Marked paid</span><span class="v">'+
dt(o.paid_at)+'</span>':'')+(o.appeal_reason?'<span class="k">Appeal</span><span class="v" style="color:var(--gold)">'+
esc(o.appeal_reason)+'</span>':'')+(o.admin_note?'<span class="k">Decision</span><span class="v">'+esc(o.admin_note)+'</span>':'')+
(o.cancel_reason?'<span class="k">Cancel</span><span class="v">'+esc(o.cancel_reason)+'</span>':'')+'</div><details><summary class="k" '+
'style="cursor:pointer">Chat ('+(o.messages||[]).length+')</summary><div style="display:flex;flex-direction:column;gap:4px;margin-top:6px">'+
(o.messages||[]).map(function(m){return '<div style="font-size:12.5px;background:var(--card2);border-radius:8px;padding:6px 8px"><b '+
'style="color:'+(m.sender==='Buyer'?'var(--up)':m.sender==='Seller'?'var(--dn)':'var(--gold)')+'">'+m.sender+'</b> <span class="k">'+
dt(m.at)+'</span><div style="white-space:pre-line">'+esc(m.body||'')+'</div>'+(m.file?'<button class="btn dark" style="height:28px;'+
'font-size:12px;margin-top:4px" onclick="p2pImg(\''+esc(m.file)+'\')">Open photo</button>':'')+'</div>';}).join('')+'</div></details>'+
(open?'<input class="in" id="pn'+o.id+'" placeholder="Decision note / message to both" style="margin-top:8px"><div class="row" '+
'style="margin-top:8px"><button class="btn dark" onclick="p2pMsg('+o.id+')">Send message</button><button class="btn ok" onclick="p2pRes('+
o.id+',\'buyer\')">Release to buyer</button><button class="btn bad" onclick="p2pRes('+o.id+',\'seller\')">Return to seller</button></div>':
'')+'</div>';}).join('')||'<div class="k">Nothing here.</div>')+'<div class="card"><div class="bn" style="font-size:15px;margin-bottom:8px">'+
'P2P settings</div><div style="display:flex;flex-direction:column;gap:8px"><label class="k" style="display:flex;gap:6px;align-items:center">'+
'<input type="checkbox" id="pk"'+(st.kyc_required?' checked':'')+'> KYC needed for P2P</label><label class="fl">P2P fee from buyer (%)'+
'<input class="in" id="pf" value="'+(+st.fee*100)+'"></label><label class="k" style="display:flex;gap:6px;align-items:center"><input '+
'type="checkbox" id="pe"'+(st.enabled?' checked':'')+'> P2P is ON</label><button class="btn gold" onclick="p2pSet()">Save</button></div></div>';});}
function p2pImg(p){sb.storage.from('p2p').createSignedUrl(p,600).then(function(r){if(r.error){say(r.error.message);return;}window.open(r.data.signedUrl,'_blank');});}
function p2pMsg(id){var t=$('pn'+id).value.trim();if(!t){say('Write a message');return;}rpc('nx_admin_p2p_msg',{p_order:id,p_body:t}).then(function(){say('Sent');vP2p();});}
function p2pRes(id,w){var n=$('pn'+id).value.trim();if(!n){say('Write the decision note');return;}if(!confirm(w==='buyer'?
'Release the USDT to the BUYER?':'Return the USDT to the SELLER?'))return;rpc('nx_admin_p2p_resolve',{p_order:id,p_winner:w,p_note:n})
.then(function(){say('Done');vP2p();});}
function p2pSet(){rpc('nx_admin_p2p_settings',{p_kyc:$('pk').checked,p_fee:(+$('pf').value||0)/100,p_enabled:$('pe').checked}).then(function(){
say('Saved');vP2p();});}

/* ---- KYC ---- */
var KSUB='pending';function setK(s){KSUB=s;vKyc();}
function vKyc(){rpc('nx_admin_kyc',{p_status:KSUB}).then(function(l){$('view').innerHTML='<div class="sub">'+
[['pending','Pending'],['approved','Approved'],['rejected','Rejected'],['all','All']].map(function(x){return '<button class="tab'+
(x[0]===KSUB?' on':'')+'" onclick="setK(\''+x[0]+'\')">'+x[1]+'</button>';}).join('')+'</div>'+(l.map(function(k){
return '<div class="card"><div class="row" style="justify-content:space-between"><b>'+esc(k.uid)+' · '+esc(k.full_name)+'</b>'+
pill(k.status)+'</div><div class="kv"><span class="k">Email</span><span class="v">'+esc(k.email)+'</span><span class="k">Country'+
'</span><span class="v">'+esc(k.country_name||k.country)+'</span><span class="k">Document</span><span class="v">'+esc(k.doc_type)+
' ending '+esc(k.doc_last4||'')+'</span><span class="k">Date of birth</span><span class="v">'+esc(k.dob)+'</span><span class="k">'+
'Mobile</span><span class="v">'+esc(k.mobile)+'</span>'+(k.address?'<span class="k">Address</span><span class="v">'+esc(k.address)+
'</span>':'')+'<span class="k">Submitted</span><span class="v">'+dt(k.created_at)+'</span>'+(+k.rejected_before?'<span class="k">'+
'History</span><span class="v" style="color:var(--dn)">Rejected '+k.rejected_before+' time(s) before</span>':'')+(k.note?
'<span class="k">Note</span><span class="v">'+esc(k.note)+'</span>':'')+'</div><div class="row">'+(k.files||[]).map(function(p,i){
return '<button class="btn dark" style="height:34px" onclick="viewDoc(\''+esc(p)+'\')">'+(['Front','Back','Selfie'][i]||'File '+
(i+1))+'</button>';}).join('')+'</div>'+(k.status==='pending'?'<div class="k" style="margin:8px 0 6px">Check: name and date of '+
'birth match the document, photo is clear, selfie is the same person, document is from the chosen country.</div><input class="in" '+
'id="kn'+k.id+'" placeholder="Reason (needed for reject)"><div class="row" style="margin-top:8px"><button class="btn ok" '+
'onclick="decK('+k.id+',\'approve\')">Approve</button><button class="btn bad" onclick="decK('+k.id+',\'reject\')">Reject</button>'+
'</div>':'')+'</div>';}).join('')||'<div class="k">Nothing here.</div>');});}
function decK(id,a){if(!confirm(a==='approve'?'Approve this KYC?':'Reject this KYC?'))return;rpc('nx_admin_kyc_decide',{p_id:id,
p_action:a,p_note:$('kn'+id).value.trim()||null}).then(function(){say('Done');vKyc();});}

/* ---- countries ---- */
var CQ='';
function vCtry(){rpc('nx_admin_countries').then(function(l){window._ct=l;var off=l.filter(function(c){return !c.allowed;}).length;
$('view').innerHTML='<div class="card"><b>'+(l.length-off)+' countries open · '+off+' closed</b><div class="k" style="margin-top:4px">'+
'Closed countries cannot sign up. People who already have an account keep it.</div></div><input class="in" id="cq" '+
'placeholder="Search country" value="'+esc(CQ)+'" oninput="CQ=this.value;drawCt()" style="margin-bottom:10px"><div id="ctl"></div>';
drawCt();});}
function drawCt(){var q=CQ.toLowerCase();$('ctl').innerHTML=(window._ct||[]).filter(function(c){return !q||c.name.toLowerCase()
.indexOf(q)>-1||c.code.toLowerCase()===q;}).map(function(c){return '<div class="card row" style="justify-content:space-between;'+
'padding:10px 14px"><span><b>'+esc(c.name)+'</b> <span class="k">'+esc(c.region)+'</span></span><button class="btn '+
(c.allowed?'ok':'bad')+'" style="height:34px;min-width:70px" onclick="setC(\''+c.code+'\','+(!c.allowed)+')">'+(c.allowed?'On':'Off')+
'</button></div>';}).join('');}
function setC(code,on){var c=(window._ct||[]).filter(function(x){return x.code===code;})[0];if(!confirm((on?'Open ':'Close ')+
c.name+' for sign up?'))return;rpc('nx_admin_country_set',{p_code:code,p_allowed:on}).then(function(){c.allowed=on;say('Saved');
drawCt();});}

/* ---- audit ---- */
function vAudit(){rpc('nx_admin_audit').then(function(l){$('view').innerHTML=l.map(function(a){return '<div class="card"><div '+
'class="row" style="justify-content:space-between"><b>'+esc(a.action)+'</b><span class="k">'+dt(a.created_at)+'</span></div><div '+
'class="k">'+esc(a.admin_email||'')+' · '+esc(a.target||'')+'</div><div class="v" style="font-size:12px;margin-top:4px">'+
esc(a.details?JSON.stringify(a.details):'')+'</div></div>';}).join('')||'<div class="k">No actions yet.</div>';});}
</script>
